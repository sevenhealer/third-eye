# Third-Eye Redis Configuration

# Persistence — appendonly for event safety
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory
maxmemory 2gb
maxmemory-policy allkeys-lru

# Security
protected-mode yes
# Password set via command-line --requirepass in docker-compose

# Performance
tcp-keepalive 300
tcp-backlog 511
hz 20

# Slow log (operations > 10ms)
slowlog-log-slower-than 10000
slowlog-max-len 256

# Disable dangerous commands
rename-command FLUSHALL ""
rename-command FLUSHDB  ""
rename-command DEBUG    ""
rename-command CONFIG   "CONFIG_thirdeye_internal"
