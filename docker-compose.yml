version: "3.9"

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  backend:
    driver: bridge
  llm_isolated:           # LLM processes have no internet access
    driver: bridge
    internal: true

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  kafka_data:
  mlflow_data:
  prometheus_data:
  grafana_data:
  ollama_models:
  minio_data:

# ── GPU helper ────────────────────────────────────────────────────────────────
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thirdeye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-thirdeye}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./infrastructure/timescaledb/schema.sql:/docker-entrypoint-initdb.d/02_timescale.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thirdeye}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    <<: [*restart, *logging]
    # Self-hosted S3-compatible object storage for clips, snapshots, face crops
    # and evidence. Console on :9001, S3 API on :9000.
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-thirdeye}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?run 'make setup' to generate .env secrets (incl. S3_SECRET_KEY)}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks: [backend]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    <<: [*restart, *logging]
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "127.0.0.1:6379:6379"
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    <<: [*restart, *logging]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "2g"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./infrastructure/neo4j/init.cypher:/init/init.cypher:ro
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    networks: [backend]
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    <<: [*restart, *logging]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: third-eye-kafka-cluster-001
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"
    networks: [backend]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    networks: [backend]
    volumes:
      - ./infrastructure/kafka/create_topics.sh:/create_topics.sh:ro
    command: ["/bin/bash", "/create_topics.sh"]
    restart: "no"

  # ── Ollama (local LLM — isolated network, no internet) ──────────────────────

  ollama:
    image: ollama/ollama:latest
    <<: [*restart, *logging, *gpu]
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks: [llm_isolated, backend]

  # ── Core Pipeline Services ───────────────────────────────────────────────────

  ingestion:
    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile
    <<: [*restart, *logging, *gpu]
    env_file: .env
    volumes:
      - ./configs:/app/configs:ro
      - ./models:/app/models:ro
      - /tmp/third-eye-archive:/archive
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]

  face-pipeline:
    build:
      context: .
      dockerfile: docker/face_pipeline.Dockerfile
    <<: [*restart, *logging, *gpu]
    env_file: .env
    volumes:
      - ./configs:/app/configs:ro
      - ./models:/app/models:ro
      - ./data/enrolled:/app/data/enrolled
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]

  object-pipeline:
    build:
      context: .
      dockerfile: docker/object_pipeline.Dockerfile
    <<: [*restart, *logging, *gpu]
    env_file: .env
    volumes:
      - ./configs:/app/configs:ro
      - ./models:/app/models:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]

  event-engine:
    build:
      context: .
      dockerfile: docker/event_engine.Dockerfile
    <<: [*restart, *logging]
    env_file: .env
    volumes:
      - ./configs:/app/configs:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]

  memory-service:
    build:
      context: .
      dockerfile: docker/memory_service.Dockerfile
    <<: [*restart, *logging]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks: [backend]

  nlq-service:
    build:
      context: .
      dockerfile: docker/nlq_service.Dockerfile
    <<: [*restart, *logging, *gpu]
    env_file: .env
    volumes:
      - ./configs:/app/configs:ro
      - ./models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started
    networks: [backend, llm_isolated]

  # ── API ───────────────────────────────────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    <<: [*restart, *logging]
    env_file: .env
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Observability ─────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    <<: [*restart, *logging]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-admin-api"
    networks: [backend]

  grafana:
    image: grafana/grafana:10.4.0
    <<: [*restart, *logging]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    networks: [backend]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    <<: [*restart, *logging]
    environment:
      MLFLOW_BACKEND_STORE_URI: sqlite:///mlflow/mlflow.db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
      - ./models:/mlflow/artifacts/models:ro
    ports:
      - "127.0.0.1:5001:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    networks: [backend]
