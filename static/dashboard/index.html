<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Third-Eye Operator Dashboard</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0e1116; color: #e6e6e6;
  }
  header {
    padding: 12px 20px; background: #161b22; border-bottom: 1px solid #2a2f37;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #login-box {
    max-width: 320px; margin: 80px auto; padding: 24px; background: #161b22;
    border-radius: 8px; border: 1px solid #2a2f37;
  }
  #login-box input {
    width: 100%; box-sizing: border-box; margin-bottom: 10px; padding: 8px;
    background: #0e1116; color: #e6e6e6; border: 1px solid #2a2f37; border-radius: 4px;
  }
  #login-box button, header button {
    padding: 8px 14px; background: #2563eb; color: white; border: none;
    border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  #login-error { color: #f87171; font-size: 13px; min-height: 18px; }
  main { display: none; padding: 16px; gap: 16px; flex-direction: column; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
  .cam-tile, .panel {
    background: #161b22; border: 1px solid #2a2f37; border-radius: 8px; overflow: hidden;
  }
  .cam-tile { cursor: pointer; }
  .cam-tile img { width: 100%; display: block; background: #000; aspect-ratio: 16/9; object-fit: contain; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    z-index: 50; align-items: center; justify-content: center;
  }
  .modal-box {
    background: #161b22; border: 1px solid #2a2f37; border-radius: 8px; padding: 14px;
  }
  .modal-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; gap: 12px;
  }
  .modal-head button {
    padding: 4px 10px; background: #2a2f37; color: #e6e6e6; border: none;
    border-radius: 4px; cursor: pointer;
  }
  #merge-search {
    margin-bottom: 8px; padding: 7px; background: #0e1116; color: #e6e6e6;
    border: 1px solid #2a2f37; border-radius: 4px; box-sizing: border-box; width: 100%;
  }
  .merge-row { padding: 8px; border-bottom: 1px solid #2a2f37; cursor: pointer; font-size: 13px; }
  .merge-row:hover { background: #1c2128; }
  .cam-tile .label {
    display: flex; justify-content: space-between; padding: 6px 10px; font-size: 13px;
  }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .status-online { background: #22c55e; }
  .status-offline, .status-unknown { background: #6b7280; }
  .panel { padding: 14px; }
  .panel h2 { font-size: 14px; margin: 0 0 10px; color: #9ca3af; text-transform: uppercase; letter-spacing: .04em; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #2a2f37; }
  th { color: #9ca3af; font-weight: 500; }
  #zones-table tbody tr { cursor: pointer; }
  #zones-table tbody tr:hover { background: #1c2128; }
  .log-row.unknown { color: #fbbf24; }
  .log-row .still-here { color: #22c55e; }
  .badge { padding: 2px 7px; border-radius: 10px; font-size: 11px; background: #2a2f37; }
  .badge.restricted { background: #7f1d1d; color: #fecaca; }
  #alerts-list { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow-y: auto; }
  #alerts-list li {
    padding: 8px; border-bottom: 1px solid #2a2f37; font-size: 13px; display: flex;
    justify-content: space-between; gap: 10px;
  }
  #alerts-list li .sev-HIGH { color: #f87171; }
  #alerts-list li .sev-MEDIUM { color: #fbbf24; }
  #alerts-list li .sev-LOW { color: #9ca3af; }
  .empty { color: #6b7280; font-size: 13px; padding: 8px 0; }
  .cand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .cand-card { background: #0e1116; border: 1px solid #2a2f37; border-radius: 6px; overflow: hidden; }
  .cand-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #1a1f27; display: block; }
  .cand-body { padding: 8px; font-size: 12px; }
  .cand-body .meta { color: #9ca3af; margin-bottom: 6px; }
  .cand-body .suggestion { color: #fbbf24; margin-bottom: 8px; }
  .cand-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .cand-actions button {
    flex: 1; padding: 5px 6px; font-size: 11px; border: none; border-radius: 4px;
    cursor: pointer; color: white;
  }
  .btn-approve { background: #16a34a; }
  .btn-merge { background: #2563eb; }
  .btn-merge-other { background: #1d4ed8; }
  .btn-reject { background: #dc2626; }
</style>
</head>
<body>

<div id="login-box">
  <h2 style="margin-top:0">Third-Eye Login</h2>
  <input id="login-user" placeholder="Username" autocomplete="username">
  <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password">
  <button onclick="doLogin()">Sign in</button>
  <div id="login-error"></div>
</div>

<header style="display:none" id="topbar">
  <h1>Third-Eye Operator Dashboard</h1>
  <button onclick="logout()">Sign out</button>
</header>

<main id="main">
  <section>
    <h2 style="color:#9ca3af;font-size:14px;text-transform:uppercase;letter-spacing:.04em">Cameras</h2>
    <div id="cameras" class="grid"></div>
  </section>

  <section style="margin-top:18px">
    <div class="panel">
      <h2>Pending Enrollments</h2>
      <div id="candidates" class="cand-grid"><div class="empty">Loading...</div></div>
    </div>
  </section>

  <section style="margin-top:18px" class="grid">
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h2 style="margin:0">Zones</h2>
        <button onclick="openAddZone()" style="padding:5px 10px; background:#16a34a; color:white; border:none; border-radius:4px; cursor:pointer; font-size:12px;">+ Add zone</button>
      </div>
      <table id="zones-table">
        <thead><tr><th>Zone</th><th>Type</th><th>Occupants</th><th>Object counts</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="panel">
      <h2>Live Alerts</h2>
      <ul id="alerts-list"><li class="empty">Waiting for alerts...</li></ul>
    </div>
  </section>
</main>

<div id="live-modal" class="modal-overlay" onclick="if(event.target===this) closeLiveView()">
  <div class="modal-box">
    <div class="modal-head">
      <strong id="live-modal-title"></strong>
      <button onclick="closeLiveView()">Close</button>
    </div>
    <img id="live-modal-img" style="max-width:85vw; max-height:80vh; display:block; background:#000;">
  </div>
</div>

<div id="merge-modal" class="modal-overlay" onclick="if(event.target===this) closeMergePicker()">
  <div class="modal-box" style="width:320px; max-height:70vh; display:flex; flex-direction:column;">
    <div class="modal-head">
      <strong>Merge into…</strong>
      <button onclick="closeMergePicker()">Close</button>
    </div>
    <input id="merge-search" placeholder="Search people..." oninput="renderMergeList()">
    <div id="merge-list" style="overflow-y:auto; flex:1;"></div>
  </div>
</div>

<div id="zonelog-modal" class="modal-overlay" onclick="if(event.target===this) closeZoneLog()">
  <div class="modal-box" style="width:480px; max-height:75vh; display:flex; flex-direction:column;">
    <div class="modal-head">
      <strong id="zonelog-title">Zone log</strong>
      <button onclick="closeZoneLog()">Close</button>
    </div>
    <table style="width:100%; font-size:12px;">
      <thead><tr><th>Who</th><th>Entered</th><th>Exited</th></tr></thead>
      <tbody id="zonelog-body"></tbody>
    </table>
  </div>
</div>

<div id="addzone-modal" class="modal-overlay" onclick="if(event.target===this) closeAddZone()">
  <div class="modal-box" style="width:300px;">
    <div class="modal-head">
      <strong>Add zone</strong>
      <button onclick="closeAddZone()">Close</button>
    </div>
    <div id="addzone-error" style="color:#f87171; font-size:12px; min-height:16px;"></div>
    <input id="addzone-id" placeholder="zone_id (e.g. dining_room)" style="width:100%; box-sizing:border-box; margin-bottom:8px; padding:7px; background:#0e1116; color:#e6e6e6; border:1px solid #2a2f37; border-radius:4px;">
    <input id="addzone-name" placeholder="Display name (e.g. Dining Room)" style="width:100%; box-sizing:border-box; margin-bottom:8px; padding:7px; background:#0e1116; color:#e6e6e6; border:1px solid #2a2f37; border-radius:4px;">
    <select id="addzone-type" style="width:100%; box-sizing:border-box; margin-bottom:10px; padding:7px; background:#0e1116; color:#e6e6e6; border:1px solid #2a2f37; border-radius:4px;">
      <option value="general">general</option>
      <option value="restricted">restricted</option>
      <option value="entrance">entrance</option>
      <option value="exit">exit</option>
      <option value="monitored">monitored</option>
    </select>
    <button onclick="submitAddZone()" style="width:100%; padding:8px; background:#2563eb; color:white; border:none; border-radius:4px; cursor:pointer;">Create</button>
  </div>
</div>

<script>
let token = sessionStorage.getItem('te_token');
let ws = null;

function authHeaders() { return { 'Authorization': 'Bearer ' + token }; }

async function doLogin() {
  const user = document.getElementById('login-user').value;
  const pass = document.getElementById('login-pass').value;
  const body = new URLSearchParams({ username: user, password: pass });
  try {
    const res = await fetch('/api/v1/auth/login', { method: 'POST', body });
    if (!res.ok) throw new Error('Invalid credentials');
    const data = await res.json();
    token = data.access_token;
    sessionStorage.setItem('te_token', token);
    enterDashboard();
  } catch (e) {
    document.getElementById('login-error').textContent = e.message;
  }
}

function logout() {
  sessionStorage.removeItem('te_token');
  token = null;
  if (ws) ws.close();
  document.getElementById('main').style.display = 'none';
  document.getElementById('topbar').style.display = 'none';
  document.getElementById('login-box').style.display = 'block';
}

function enterDashboard() {
  document.getElementById('login-box').style.display = 'none';
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('main').style.display = 'flex';
  refreshCameras();
  refreshZones();
  refreshCandidates();
  connectAlerts();
  setInterval(refreshCameras, 2000);
  setInterval(refreshZones, 2000);
  setInterval(refreshCandidates, 4000);
}

// Preloads a new image off-DOM and only swaps the visible <img>'s src once
// it has actually finished loading, so the old frame stays on screen the
// whole time instead of flashing blank/black every poll tick.
function swapImageNoFlicker(imgEl, newSrc) {
  const probe = new Image();
  probe.onload = () => { imgEl.src = newSrc; imgEl.style.opacity = 1; };
  probe.onerror = () => { imgEl.style.opacity = 0.3; };
  probe.src = newSrc;
}

const cameraTiles = {};   // camera_id -> live DOM refs, built once and updated in place

async function refreshCameras() {
  const res = await fetch('/api/v1/cameras', { headers: authHeaders() });
  if (res.status === 401) return logout();
  const cams = await res.json();
  const root = document.getElementById('cameras');

  if (!cams.length) {
    root.innerHTML = '<div class="empty">No cameras registered.</div>';
    return;
  }
  if (root.querySelector('.empty')) root.innerHTML = '';

  const seen = new Set();
  for (const c of cams) {
    seen.add(c.camera_id);
    let t = cameraTiles[c.camera_id];
    if (!t) {
      const div = document.createElement('div');
      div.className = 'cam-tile';
      div.innerHTML = `
        <img>
        <div class="label">
          <span><span class="status-dot"></span><span class="cam-name"></span></span>
          <span class="cam-zone"></span>
        </div>`;
      div.onclick = () => openLiveView(c.camera_id, t.name.textContent);
      root.appendChild(div);
      t = cameraTiles[c.camera_id] = {
        root: div,
        img: div.querySelector('img'),
        dot: div.querySelector('.status-dot'),
        name: div.querySelector('.cam-name'),
        zone: div.querySelector('.cam-zone'),
      };
    }
    t.dot.className = `status-dot status-${c.status}`;
    t.name.textContent = c.display_name;
    t.zone.textContent = c.zone_id || '';
    swapImageNoFlicker(t.img, `/stream/${c.camera_id}/latest.jpg?t=${Date.now()}`);
  }

  for (const camId of Object.keys(cameraTiles)) {
    if (!seen.has(camId)) {
      cameraTiles[camId].root.remove();
      delete cameraTiles[camId];
    }
  }
}

function openLiveView(cameraId, displayName) {
  document.getElementById('live-modal-title').textContent = displayName || cameraId;
  document.getElementById('live-modal').style.display = 'flex';
  const img = document.getElementById('live-modal-img');
  // multipart/x-mixed-replace: the browser keeps the connection open and
  // repaints this <img> itself as each new frame arrives — no JS polling,
  // no flicker-avoidance needed, latency is just however fast run_live.py
  // publishes (see cameras.py's /mjpeg route + ShortTermMemory.publish_frame).
  img.src = `/api/v1/cameras/${cameraId}/mjpeg?token=${encodeURIComponent(token)}`;
}

function closeLiveView() {
  document.getElementById('live-modal').style.display = 'none';
  // Clearing src aborts the underlying HTTP request, which lets the
  // server's pubsub.listen() loop unsubscribe instead of streaming forever.
  document.getElementById('live-modal-img').src = '';
}

const ZONE_TYPES = ['general', 'restricted', 'entrance', 'exit', 'monitored'];

async function refreshZones() {
  const res = await fetch('/api/v1/zones', { headers: authHeaders() });
  if (res.status === 401) return logout();
  const zones = await res.json();
  const tbody = document.querySelector('#zones-table tbody');
  tbody.innerHTML = '';
  for (const z of zones) {
    const tr = document.createElement('tr');
    const typeTd = document.createElement('td');
    const select = document.createElement('select');
    select.style.cssText = 'background:#0e1116; color:#e6e6e6; border:1px solid #2a2f37; border-radius:4px; font-size:12px; padding:2px;';
    select.className = z.zone_type === 'restricted' ? 'badge restricted' : '';
    for (const t of ZONE_TYPES) {
      const opt = document.createElement('option');
      opt.value = t; opt.textContent = t; opt.selected = t === z.zone_type;
      select.appendChild(opt);
    }
    select.onclick = (ev) => ev.stopPropagation();   // don't also open the presence log
    select.onchange = () => updateZoneType(z.zone_id, select.value);
    typeTd.appendChild(select);

    tr.innerHTML = `<td>${z.display_name}</td>`;
    tr.appendChild(typeTd);
    tr.insertAdjacentHTML('beforeend', `
      <td>${z.occupants.length ? z.occupants.map(o => o.display_name).join(', ') : '—'}</td>
      <td>${Object.entries(z.object_counts).map(([k,v]) => `${k}:${v}`).join(', ') || '—'}</td>`);
    tr.onclick = () => openZoneLog(z.zone_id, z.display_name);
    tbody.appendChild(tr);
  }
}

async function updateZoneType(zoneId, newType) {
  const res = await fetch(`/api/v1/zones/${zoneId}`, {
    method: 'PATCH',
    headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ zone_type: newType }),
  });
  if (res.status === 401) return logout();
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    alert(`Couldn't update zone type: ${err.detail || res.statusText}`);
  }
  refreshZones();
}

function openAddZone() {
  document.getElementById('addzone-id').value = '';
  document.getElementById('addzone-name').value = '';
  document.getElementById('addzone-type').value = 'general';
  document.getElementById('addzone-error').textContent = '';
  document.getElementById('addzone-modal').style.display = 'flex';
}

function closeAddZone() {
  document.getElementById('addzone-modal').style.display = 'none';
}

async function submitAddZone() {
  const zone_id = document.getElementById('addzone-id').value.trim();
  const display_name = document.getElementById('addzone-name').value.trim();
  const zone_type = document.getElementById('addzone-type').value;
  const errEl = document.getElementById('addzone-error');
  if (!zone_id || !display_name) {
    errEl.textContent = 'zone_id and display name are both required.';
    return;
  }
  const res = await fetch('/api/v1/zones', {
    method: 'POST',
    headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ zone_id, display_name, zone_type }),
  });
  if (res.status === 401) return logout();
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    errEl.textContent = err.detail || 'Failed to create zone.';
    return;
  }
  closeAddZone();
  refreshZones();
}

async function openZoneLog(zoneId, displayName) {
  document.getElementById('zonelog-title').textContent = `${displayName} — who came and went`;
  document.getElementById('zonelog-body').innerHTML = '<tr><td colspan="3" class="empty">Loading...</td></tr>';
  document.getElementById('zonelog-modal').style.display = 'flex';
  const res = await fetch(`/api/v1/zones/${zoneId}/presence-log`, { headers: authHeaders() });
  if (res.status === 401) return logout();
  const entries = await res.json();
  const body = document.getElementById('zonelog-body');
  if (!entries.length) {
    body.innerHTML = '<tr><td colspan="3" class="empty">No recorded visits yet.</td></tr>';
    return;
  }
  body.innerHTML = entries.map(e => `
    <tr class="log-row ${e.is_unknown ? 'unknown' : ''}">
      <td>${e.display_name}</td>
      <td>${new Date(e.entry_time).toLocaleString()}</td>
      <td>${e.exit_time ? new Date(e.exit_time).toLocaleString() : '<span class="still-here">still here</span>'}</td>
    </tr>
  `).join('');
}

function closeZoneLog() {
  document.getElementById('zonelog-modal').style.display = 'none';
}

const candImageCache = {};   // candidate_id -> blob URL, fetched once per page session

async function loadCandidateImage(candidateId, cropUrl) {
  if (candImageCache[candidateId]) return candImageCache[candidateId];
  const res = await fetch(cropUrl, { headers: authHeaders() });
  if (!res.ok) return null;
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  candImageCache[candidateId] = url;
  return url;
}

async function refreshCandidates() {
  const res = await fetch('/api/v1/identities/candidates?status=pending', { headers: authHeaders() });
  if (res.status === 401) return logout();
  const data = await res.json();
  const root = document.getElementById('candidates');
  if (!data.candidates.length) {
    root.innerHTML = '<div class="empty">No pending enrollments.</div>';
    return;
  }
  root.innerHTML = data.candidates.map(c => `
    <div class="cand-card" id="cand-${c.candidate_id}">
      <img id="cand-img-${c.candidate_id}" alt="face crop">
      <div class="cand-body">
        <div class="meta">cam ${c.camera_id} · track ${c.track_id} · last seen ${new Date(c.last_seen_at).toLocaleTimeString()}</div>
        ${c.suggested_name
          ? `<div class="suggestion">Looks like ${c.suggested_name} (${c.suggested_similarity})</div>`
          : '<div class="suggestion" style="color:#6b7280">No gallery match</div>'}
        <div class="cand-actions">
          <button class="btn-approve" onclick="approveCandidate('${c.candidate_id}')">New person</button>
          ${c.suggested_person_id
            ? `<button class="btn-merge" onclick="mergeCandidate('${c.candidate_id}', '${c.suggested_person_id}', '${c.suggested_name}')">Merge → ${c.suggested_name}</button>`
            : ''}
          <button class="btn-merge-other" onclick="openMergePicker('${c.candidate_id}')">Merge to other…</button>
          <button class="btn-reject" onclick="rejectCandidate('${c.candidate_id}')">Reject</button>
        </div>
      </div>
    </div>
  `).join('');

  for (const c of data.candidates) {
    if (!c.crop_urls.length) continue;
    const url = await loadCandidateImage(c.candidate_id, c.crop_urls[0]);
    const img = document.getElementById(`cand-img-${c.candidate_id}`);
    if (img && url) img.src = url;
  }
}

async function approveCandidate(candidateId) {
  const name = prompt('Display name for this new person:');
  if (!name) return;
  await fetch(`/api/v1/identities/candidates/${candidateId}/approve`, {
    method: 'POST',
    headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ display_name: name }),
  });
  mergeAllPersons = [];   // a new person now exists — refetch next time the picker opens
  refreshCandidates();
}

let mergeTargetCandidateId = null;
let mergeAllPersons = [];   // fetched once per page session, invalidated on new-person approval

async function openMergePicker(candidateId) {
  mergeTargetCandidateId = candidateId;
  document.getElementById('merge-search').value = '';
  if (!mergeAllPersons.length) {
    const res = await fetch('/api/v1/identities', { headers: authHeaders() });
    mergeAllPersons = res.ok ? await res.json() : [];
  }
  document.getElementById('merge-modal').style.display = 'flex';
  renderMergeList();
}

function closeMergePicker() {
  document.getElementById('merge-modal').style.display = 'none';
  mergeTargetCandidateId = null;
}

function renderMergeList() {
  const q = document.getElementById('merge-search').value.trim().toLowerCase();
  const list = document.getElementById('merge-list');
  const matches = mergeAllPersons.filter(p => p.display_name.toLowerCase().includes(q));
  list.innerHTML = '';
  if (!matches.length) {
    list.innerHTML = '<div class="empty">No match.</div>';
    return;
  }
  for (const p of matches) {
    const row = document.createElement('div');
    row.className = 'merge-row';
    row.textContent = p.display_name;
    // closure + textContent, not a template-string onclick attribute, so a
    // display_name containing a quote/apostrophe can't break the handler.
    row.onclick = () => { mergeCandidate(mergeTargetCandidateId, p.person_id, p.display_name); closeMergePicker(); };
    list.appendChild(row);
  }
}

async function mergeCandidate(candidateId, personId, name) {
  if (!confirm(`Merge this candidate into ${name}?`)) return;
  await fetch(`/api/v1/identities/candidates/${candidateId}/approve`, {
    method: 'POST',
    headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ person_id: personId }),
  });
  refreshCandidates();
}

async function rejectCandidate(candidateId) {
  if (!confirm('Reject this candidate?')) return;
  await fetch(`/api/v1/identities/candidates/${candidateId}/reject`, {
    method: 'POST', headers: authHeaders(),
  });
  refreshCandidates();
}

function connectAlerts() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/api/v1/alerts/ws?token=${token}`);
  const list = document.getElementById('alerts-list');
  ws.onopen = () => { list.innerHTML = '<li class="empty">Connected — waiting for alerts...</li>'; };
  ws.onclose = () => { list.insertAdjacentHTML('afterbegin', '<li class="empty">Disconnected.</li>'); };
  ws.onmessage = (ev) => {
    const a = JSON.parse(ev.data);
    if (list.querySelector('.empty')) list.innerHTML = '';
    const li = document.createElement('li');
    li.innerHTML = `<span>${a.event_type || a.alert_type || 'EVENT'} — ${a.zone_id || ''}</span>
                     <span class="sev-${a.severity || 'LOW'}">${a.severity || ''}</span>`;
    list.insertAdjacentElement('afterbegin', li);
  };
}

if (token) enterDashboard();
