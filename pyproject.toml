[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "third-eye"
version = "0.1.0"
description = "Local-first visual intelligence platform"
requires-python = ">=3.11"
dependencies = [
    # Floors below were refreshed 2026-06-13 to current stable (latest seen
    # on PyPI in parens). No upper caps — installs pull the newest. Three
    # MAJOR bumps are NOT yet validated on the GPU box, so their floors stay
    # conservative; validate the API then raise: insightface 1.0.1 (was
    # 0.7.x — check FaceAnalysis/buffalo_l), redis 8.0.0, neo4j 6.2.0.
    # Core ML
    # CUDA alignment (Linux GPU boxes): PyPI torch ships CUDA 13 builds but
    # stable onnxruntime-gpu is CUDA 12 — mixing them breaks the CUDA
    # provider (libcublasLt.so.12 not found). Install torch from the cu128
    # index BEFORE `pip install -e .`:  make install-gpu
    "torch>=2.4.0",              # latest 2.12.0
    "torchvision>=0.19.0",
    "torchaudio>=2.4.0",
    "onnxruntime-gpu>=1.20.0; sys_platform == 'linux'",   # latest 1.26.0
    "onnxruntime>=1.20.0; sys_platform == 'darwin'",
    "numpy>=1.26.0",            # latest 2.4.6 (2.x allowed; some legacy wheels want 1.x)
    "opencv-python-headless>=4.9.0",
    "Pillow>=10.2.0",

    # InsightFace (SCRFD, ArcFace) — 1.0.1 available; keep 0.7.x floor until
    # the buffalo_l FaceAnalysis API (app.get, face.pose) is re-verified
    "insightface>=0.7.3",
    "onnx>=1.15.0",

    # Object detection / tracking — 8.4+ REQUIRED for YOLO26 weights/classes
    # (YOLO26, YOLOWorld, YOLOE). latest 8.4.66
    "ultralytics>=8.4.0",

    # ReID — torchreid 1.4.x is not on PyPI and its build needs numpy/Cython
    # preinstalled; src/tracking/reid.py degrades gracefully without it.
    # To enable OSNet ReID, install manually after `pip install -e .`:
    #   pip install numpy cython
    #   pip install --no-build-isolation git+https://github.com/KaiyangZhou/deep-person-reid.git

    # Video
    "av>=12.0.0",

    # API
    "fastapi>=0.115.0",         # latest 0.136.3
    "uvicorn[standard]>=0.30.0",
    "PyJWT>=2.10.0",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.9",
    "websockets>=13.0",         # latest 15.x

    # Databases
    "asyncpg>=0.30.0",          # latest 0.31.0
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.0",    # latest 8.0.0 (major — validate before raising floor)
    "neo4j>=5.18.0",            # latest 6.2.0 (major — validate before raising floor)
    "pgvector>=0.3.0",
    "psycopg[binary,pool]>=3.2.0",

    # Kafka
    "aiokafka>=0.10.0",

    # Object storage (MinIO / S3-compatible) — clips, snapshots, evidence
    "boto3>=1.34.0",

    # Config & validation
    "pydantic>=2.9.0",          # latest 2.13.4
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",

    # NLP / LLM
    "spacy>=3.8.0",             # latest 3.8.14
    "ollama>=0.4.0",            # latest 0.6.2 (0.1.x client API was different)
    "tiktoken>=0.6.0",

    # Observability
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",

    # Crypto
    "cryptography>=42.0.0",

    # Utils
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "schedule>=1.2.0",
]

[project.optional-dependencies]
training = [
    "mlflow>=2.15.0",
    "dvc>=3.50.0",
    "timm>=1.0.0",             # 1.x stable line
    "albumentations>=1.4.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "tensorboard>=2.17.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
third-eye = "src.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
