[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "third-eye"
version = "0.1.0"
description = "Local-first visual intelligence platform"
requires-python = ">=3.11"
dependencies = [
    # Core ML
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "torchaudio>=2.2.0",
    "onnxruntime-gpu>=1.17.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "Pillow>=10.2.0",

    # InsightFace (SCRFD, AdaFace)
    "insightface>=0.7.3",
    "onnx>=1.15.0",

    # Object detection / tracking
    "ultralytics>=8.1.0",

    # ReID
    "torchreid>=1.4.0",

    # Video
    "av>=12.0.0",
    "ffmpeg-python>=0.2.0",

    # API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "websockets>=12.0",

    # Databases
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.0",
    "neo4j>=5.18.0",
    "pgvector>=0.2.5",
    "psycopg[binary,pool]>=3.1.0",

    # Kafka
    "aiokafka>=0.10.0",

    # Config & validation
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",

    # NLP / LLM
    "spacy>=3.7.0",
    "ollama>=0.1.8",
    "tiktoken>=0.6.0",

    # Observability
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",

    # Crypto
    "cryptography>=42.0.0",

    # Utils
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "schedule>=1.2.0",
]

[project.optional-dependencies]
training = [
    "mlflow>=2.11.0",
    "dvc>=3.47.0",
    "timm>=0.9.16",
    "albumentations>=1.4.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "tensorboard>=2.16.0",
]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
third-eye = "src.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
