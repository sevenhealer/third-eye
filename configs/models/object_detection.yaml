primary:
  name: yolov9c
  weight_file: "yolov9c.pt"
  input_size: 1280
  confidence_threshold: 0.45
  nms_threshold: 0.45
  use_tensorrt: ${USE_TENSORRT}
  device: ${DEVICE}

forensic:
  name: yolov9e
  weight_file: "yolov9e.pt"
  input_size: 1280
  confidence_threshold: 0.35
  load_on_demand: true      # Only loaded when forensic search is triggered

# Standard COCO classes always enabled
# Custom domain classes (require fine-tuning):
custom_classes:
  enabled: false            # Set true after fine-tuning with domain data
  weight_file: "yolov9c_custom.pt"
  classes:
    - server_rack
    - monitor
    - workstation
    - fire_extinguisher
    - access_panel
    - desk

# Per-camera ROI masks (filter detections to relevant regions)
roi_filters:
  cam-01:
    enabled: false
    polygon: []             # [{x: 0.1, y: 0.2}, ...] normalized coordinates
  cam-02:
    enabled: false
    polygon: []
